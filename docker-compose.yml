version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: aslps_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-aslps_db}
    volumes:
      - mongodb_data:/data/db
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - aslps_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aslps_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - MONGODB_HOST=mongodb://mongodb:27017/
      - MONGODB_DB=${MONGODB_DB:-aslps_db}
      - MONGODB_USERNAME=${MONGODB_USERNAME:-admin}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-admin123}
      - MONGODB_AUTH_SOURCE=admin
      - ML_MODEL_PATH=/app/ml_model/models/rf_model.pkl
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - ./backend:/app
      - ./ml_model:/app/ml_model
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - aslps_network
    command: >
      sh -c "python manage.py migrate || true &&
             python manage.py collectstatic --noinput || true &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aslps_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - aslps_network
    command: npm run dev

volumes:
  mongodb_data:
    driver: local

networks:
  aslps_network:
    driver: bridge

